# Shopify App Configuration — DisputeDesk (Dispute Ops)
# https://shopify.dev/docs/apps/tools/cli/configuration

name = "DisputeDesk"
client_id = "84f40ec77c9ba18e9eabc1657d9b6af8"
application_url = "https://disputedesk.app"
embedded = true

[auth]
redirect_urls = [
  "https://disputedesk.app/api/auth/shopify/callback",
]

[access_scopes]
# Evidence scopes approved by App Review and synced to app config (2026-03-04, ticket 64535407).
# Tightened 2026-05-07 — production code uses ONLY the scopes below (verified by grep in
# tests/unit/shopifyScopes.test.ts and the App Store review checklist). Seed scripts under
# scripts/shopify/ run via SHOPIFY_SEED_CLIENT_ID, a separate Partners app with a broader set
# (write_draft_orders, write_fulfillments, write_products, write_inventory, read_files,
# write_files, read_inventory, read_locations, write_orders,
# write_merchant_managed_fulfillment_orders) — never granted to merchants of the production app.
scopes = "read_orders,read_customers,read_products,read_fulfillments,read_shipping,read_shopify_payments_disputes,read_shopify_payments_dispute_evidences,write_shopify_payments_dispute_evidences,read_shopify_payments_dispute_file_uploads,write_shopify_payments_dispute_file_uploads"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "/api/webhooks/shop-update"

  # GDPR mandatory webhooks (App Store requirement). Handlers in
  # app/api/webhooks/{customers-data-request,customers-redact,shop-redact}/.
  [[webhooks.subscriptions]]
  topics = ["customers/data_request"]
  uri = "/api/webhooks/customers-data-request"

  [[webhooks.subscriptions]]
  topics = ["customers/redact"]
  uri = "/api/webhooks/customers-redact"

  [[webhooks.subscriptions]]
  topics = ["shop/redact"]
  uri = "/api/webhooks/shop-redact"

# disputes/create and disputes/update registered at runtime (OAuth) - require protected-customer-data approval in Partners

# App proxy section removed 2026-05-07 — DisputeDesk does not use storefront proxying.
# If the CLI rejects the missing block on a future `shopify app config push`, restore the
# minimal placeholder; it had been kept solely to satisfy older CLI validation.

[pos]
embedded = false
