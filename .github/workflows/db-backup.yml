name: DB backup → R2

# Daily off-platform Postgres dump to Cloudflare R2.
#
# Why this exists
# ---------------
# Supabase Free retains exactly one nightly snapshot. If the snapshot
# itself gets corrupted (DDL accident at 3pm, snapshot taken at 4am,
# noticed the next morning), Supabase's copy is already the bad one.
# A separate off-platform copy with 30-day retention buys the window
# you need to actually notice the incident before the only backup is
# overwritten.
#
# This is a stopgap until the project moves to Supabase Pro (PITR with
# 7-day retention + selectable recovery point). Keep this workflow live
# even after the upgrade — defense in depth against a Supabase org-level
# compromise (admin credential theft bypasses provider backups too).
#
# Why `supabase db dump`, not raw `pg_dump`
# -----------------------------------------
# Per Supabase's documented CI backup recipe
# (https://supabase.com/docs/guides/deployment/ci/backups), the CLI
# wraps pg_dump with the correct server-version client and the right
# exclude-schemas filter. Raw pg_dump against the session pooler can
# fail with `password authentication failed for user "postgres"` even
# with the correct user/pw — the CLI sidesteps that whole class of
# issue by speaking to the project via the Management API +
# Supabase-provisioned credentials.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL          postgres://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#                            Session pooler URL — copy verbatim from
#                            Supabase dashboard → Project Settings →
#                            Database → Connection string → "Session
#                            pooler" tab. NOT the direct connection
#                            (IPv6-only) and NOT the transaction pooler
#                            (port 6543).
#   R2_ACCOUNT_ID            Cloudflare account ID (found in R2 dashboard)
#   R2_ACCESS_KEY_ID         R2 API token with Object R/W on the bucket
#   R2_SECRET_ACCESS_KEY     R2 API token secret
#   R2_BUCKET                e.g. disputedesk-db-backups
#
# Restore (manual, see docs/technical.md § Disaster Recovery)
# -----------------------------------------------------------
# Three files are produced per run:
#   <stamp>-roles.sql    Roles + grants (run FIRST against the empty
#                        target — without these, schema restore fails
#                        on ALTER TABLE ... OWNER TO).
#   <stamp>-schema.sql   Tables, indexes, functions, RLS policies, etc.
#                        (run SECOND).
#   <stamp>-data.sql     Row data via COPY (run LAST).
#
# To restore into a fresh Supabase project:
#   aws s3 cp s3://$R2_BUCKET/<stamp>-roles.sql ./ --endpoint-url=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
#   aws s3 cp s3://$R2_BUCKET/<stamp>-schema.sql ./ --endpoint-url=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
#   aws s3 cp s3://$R2_BUCKET/<stamp>-data.sql ./ --endpoint-url=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
#   psql "$TARGET_DB_URL" -f <stamp>-roles.sql
#   psql "$TARGET_DB_URL" -f <stamp>-schema.sql
#   psql "$TARGET_DB_URL" -f <stamp>-data.sql

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI + aws CLI check
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase CLI
        run: |
          supabase --version
          aws --version

      # TEMPORARY — remove after first green run.
      # Prints the URL with password masked. Shows every other
      # character of the secret so we can verify the shape is exact
      # without revealing credentials.
      - name: Print masked URL for verification
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.parse as u
          raw = os.environ["SUPABASE_DB_URL_RAW"]
          print(f"length:  {len(raw)}")
          print(f"hex_first_4:  {raw[:4].encode().hex()}")
          print(f"hex_last_4:   {raw[-4:].encode().hex()}")
          stripped = raw.strip()
          print(f"stripped_length: {len(stripped)}")
          parsed = u.urlparse(stripped)
          masked_pw = "*" * len(parsed.password) if parsed.password else "<no-pw>"
          print(f"scheme:   {parsed.scheme}")
          print(f"user:     {parsed.username}")
          print(f"pw_mask:  {masked_pw}  (length {len(parsed.password) if parsed.password else 0})")
          print(f"host:     {parsed.hostname}")
          print(f"port:     {parsed.port}")
          print(f"db:       {parsed.path.lstrip('/')}")
          # Print one char of pw bracketed by length — confirms no
          # weird leading/trailing whitespace inside the password
          # itself (different from whitespace inside the URL).
          if parsed.password:
              first = parsed.password[0]
              last = parsed.password[-1]
              first_is_ws = first.isspace() or not first.isprintable()
              last_is_ws = last.isspace() or not last.isprintable()
              print(f"pw_first_char_ws_or_nonprint: {first_is_ws}")
              print(f"pw_last_char_ws_or_nonprint:  {last_is_ws}")
              # SHA-256 of the password bytes. Irreversible, doesn't
              # leak the password, but lets us compare for byte-level
              # equality with the password in .env.local (hashed the
              # same way on the local box). If hashes match, the
              # credentials are identical and the auth failure is not
              # a "wrong password" issue.
              import hashlib
              pw_sha = hashlib.sha256(parsed.password.encode()).hexdigest()
              print(f"pw_sha256: {pw_sha}")
          # Mask non-pw bytes, print every byte's hex code so we can
          # spot invisible characters (NBSP \xc2\xa0, BOM \xef\xbb\xbf,
          # zero-width \xe2\x80\x8b, etc.) that String.isspace() and
          # urlparse silently tolerate. Password bytes are shown as
          # `**` so the secret never leaks even byte-by-byte.
          pw_bytes = parsed.password.encode() if parsed.password else b""
          all_bytes = raw.encode()
          # Locate pw position to mask it
          pw_start = all_bytes.find(pw_bytes) if pw_bytes else -1
          pw_end = pw_start + len(pw_bytes) if pw_start >= 0 else -1
          out = []
          for i, b in enumerate(all_bytes):
              if pw_start <= i < pw_end:
                  out.append("**")
              else:
                  out.append(f"{b:02x}")
          print("byte_hex_with_pw_masked:")
          print(" ".join(out))
          PY

      - name: Dump roles, schema, and data
        env:
          SUPABASE_DB_URL_RAW: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL_RAW}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi
          # Strip trailing/leading whitespace — a stray newline at the
          # end of the secret (very common after copy-paste through
          # multiple browsers) makes the Go URL parser reject the
          # whole string. tr scrubs \n, \r, and literal spaces.
          SUPABASE_DB_URL=$(printf '%s' "${SUPABASE_DB_URL_RAW}" | tr -d '\n\r ')

          # Definitive auth test BEFORE the dump. If psql also gets
          # `password authentication failed`, the credential mismatch
          # is real and the issue is the secret vs Supabase DB,
          # not the dump wrapper. The CLI's docker container hides
          # this signal from the surrounding log.
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "--- psql ping ---"
          if psql "${SUPABASE_DB_URL}" -c "SELECT 1 AS auth_ok;" 2>&1; then
            echo "--- psql succeeded; proceeding to dump ---"
          else
            echo "::error::psql auth failed against the same URL the dump uses. The password in the GitHub secret does not match what the Supabase DB has."
            exit 1
          fi

          STAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          PREFIX="disputedesk-${STAMP}"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "PREFIX=${PREFIX}" >> "$GITHUB_ENV"

          # Order matters: roles, then schema, then data — the schema
          # restore expects the roles already exist for ownership/grants.
          supabase db dump --db-url "${SUPABASE_DB_URL}" -f "${PREFIX}-roles.sql"  --role-only
          supabase db dump --db-url "${SUPABASE_DB_URL}" -f "${PREFIX}-schema.sql"
          supabase db dump --db-url "${SUPABASE_DB_URL}" -f "${PREFIX}-data.sql"   --data-only --use-copy

          # Compress each file independently — smaller objects in R2,
          # and gzip lets us spot-check a single file with `zless` without
          # extracting an archive.
          gzip "${PREFIX}-roles.sql" "${PREFIX}-schema.sql" "${PREFIX}-data.sql"

          ls -lh "${PREFIX}"*.gz
          TOTAL=$(du -ch "${PREFIX}"*.gz | tail -1 | cut -f1)
          echo "Total dump size: ${TOTAL}"
          echo "TOTAL=${TOTAL}" >> "$GITHUB_ENV"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for f in "${PREFIX}"-roles.sql.gz "${PREFIX}"-schema.sql.gz "${PREFIX}"-data.sql.gz; do
            aws s3 cp "${f}" "s3://${R2_BUCKET}/${f}" \
              --endpoint-url="${ENDPOINT}" \
              --no-progress
            echo "Uploaded s3://${R2_BUCKET}/${f}"
          done

      - name: Prune old dumps (> 30 days)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          CUTOFF=$(date -u -d "30 days ago" +"%Y-%m-%d")
          echo "Pruning objects with LastModified < ${CUTOFF}"

          aws s3api list-objects-v2 \
            --bucket "${R2_BUCKET}" \
            --endpoint-url "${ENDPOINT}" \
            --query "Contents[?LastModified<'${CUTOFF}'].[Key]" \
            --output text \
          | while read -r KEY; do
              [ -z "${KEY}" ] && continue
              echo "  delete ${KEY}"
              aws s3 rm "s3://${R2_BUCKET}/${KEY}" --endpoint-url "${ENDPOINT}"
            done

      - name: Summary
        run: |
          {
            echo "### DB backup → R2"
            echo ""
            echo "- Stamp: \`${STAMP}\`"
            echo "- Files: \`${PREFIX}-{roles,schema,data}.sql.gz\`"
            echo "- Total size: ${TOTAL}"
            echo "- Bucket: \`${R2_BUCKET}\`"
            echo "- Retention: 30 days"
          } >> "$GITHUB_STEP_SUMMARY"
