name: CI

# Re-enabled 2026-05-03 (Phase 1.1). All steps verified green on master HEAD
# locally before flipping the trigger:
#   - npx tsc --noEmit (exit 0)
#   - npm run lint    (exit 0; warnings only)
#   - npm test        (922/922 pass)
#   - npm run build   (exit 0)
#   - npm audit --audit-level=critical (exit 0; high/moderate sit below the filter)
#   - 4 grep guards   (no matches)
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new push lands. PRs and
# master each have their own concurrency lane.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Security audit
        run: npm audit --audit-level=critical

      - name: Forbidden copy check (source + translations)
        run: |
          if grep -rn "submit response\|submit to card network\|file dispute response" \
            --include="*.tsx" --include="*.ts" --include="*.json" \
            app/ components/ lib/ messages/ 2>/dev/null; then
            echo "ERROR: Found forbidden UX copy in source or translation files"
            exit 1
          fi
          echo "No forbidden copy found"

      # Plan v3 §P2.4b — Canonical Registry Lock.
      # No code outside lib/argument/canonicalEvidence.ts may assign a
      # canonical evidence category. Tests and the scoring engine read
      # the category through `categoryFor()` and produce strings via
      # `computeContributions`, but they NEVER write the literal
      # `category: "strong" | "moderate" | "supporting" | "invalid"`.
      - name: Category source-of-truth guard
        run: |
          MATCHES=$(grep -rn -E '"category"\s*:\s*"(strong|moderate|supporting|invalid)"' \
            --include="*.ts" --include="*.tsx" \
            app/ lib/ 2>/dev/null \
            | grep -v -E "lib/argument/canonicalEvidence\.ts|lib/argument/__tests__/|lib/argument/caseStrength\.ts" \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: canonical evidence category assigned outside the registry:"
            echo "$MATCHES"
            echo ""
            echo "Plan v3 §P2.4b: only lib/argument/canonicalEvidence.ts may assign category."
            exit 1
          fi
          echo "No category assignments outside the registry"

      # Plan v3 §P2.6 — Argument Purity Rule.
      # Vague summary rows like "Order details verified" or
      # "Transaction record" must not appear in rendered UI. They
      # fold multiple signals into a single claim, which the new
      # evidence-classification system explicitly forbids.
      - name: Argument purity copy check
        run: |
          if grep -rn -E "Order details verified|Transaction record verified" \
            --include="*.tsx" --include="*.ts" --include="*.json" \
            app/ components/ lib/ messages/ 2>/dev/null; then
            echo "ERROR: vague summary copy found — see plan §P2.6 (Argument Purity Rule)"
            exit 1
          fi
          echo "No vague summary copy found"

      # Plan v3 §P2.7 — Dispute-detail strength pills MUST come from the
      # canonical registry (`categoryFor` + `categoryBadge`). The legacy
      # CATEGORY_RELEVANCE / categoryImpactLabel system is removed.
      - name: Evidence-pill source-of-truth guard
        run: |
          MATCHES=$(grep -rn -E "CATEGORY_RELEVANCE|categoryImpactLabel|\"High impact\"" \
            --include="*.ts" --include="*.tsx" \
            "app/(embedded)/app/disputes/" 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: dispute-detail UI references the deprecated relevance system:"
            echo "$MATCHES"
            echo ""
            echo "Plan v3 §P2.7: pill labels come from categoryBadge(categoryFor(...))."
            exit 1
          fi
          echo "Dispute detail uses the canonical registry"

  # ─────────────────────────────────────────────────────────────────────
  # E2E job — runs only on push to master + manual dispatch.
  #
  # Deliberately NOT triggered on PRs: every PR run would write rows to
  # the real Supabase project (auth sign-in, dispute/pack seed) and add
  # concurrent-write pressure that masks real product issues. Running
  # post-merge on master gives us a sanity signal without the spam.
  #
  # Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
  #   - E2E_TEST_EMAIL              merchant test user email
  #   - E2E_TEST_PASSWORD           merchant test user password
  #   - NEXT_PUBLIC_SUPABASE_URL    same as your .env.local
  #   - NEXT_PUBLIC_SUPABASE_ANON_KEY  same as your .env.local
  #   - SUPABASE_URL                same as your .env.local
  #   - SUPABASE_SERVICE_ROLE_KEY   same as your .env.local
  # The test user must already exist in Supabase Auth and have at least
  # one row in `portal_user_shops` linking them to a real shops.id.
  #
  # Specs included:
  #   - e2e/save-to-shopify.spec.ts          (route gates: 401 + 404)
  #   - e2e/save-to-shopify-seeded.spec.ts   (seeded happy path: 202 + jobs row + status flip)
  # The other e2e specs (portal-sections, portal-setup-checklist,
  # admin-resources-hub) can be added to `npm run test:e2e -- ...` when
  # we want them in CI; keeping the lane narrow until we trust this one.
  # ─────────────────────────────────────────────────────────────────────
  e2e:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Soft gate: if secrets aren't set yet (e.g. first run after merging
      # this workflow before the maintainer adds them in repo settings),
      # skip cleanly with a useful message rather than failing the run on
      # blank-credential sign-in. Once secrets are configured, every
      # subsequent run executes the suite.
      - name: Check E2E secrets are configured
        id: gate
        run: |
          if [ -z "${{ secrets.E2E_TEST_EMAIL }}" ] || \
             [ -z "${{ secrets.E2E_TEST_PASSWORD }}" ] || \
             [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] || \
             [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::E2E secrets not configured. Add E2E_TEST_EMAIL, E2E_TEST_PASSWORD, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY at Settings → Secrets and variables → Actions to enable the e2e suite."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run save-to-shopify e2e specs
        if: steps.gate.outputs.skip != 'true'
        env:
          CI: "true"
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx playwright test e2e/save-to-shopify.spec.ts e2e/save-to-shopify-seeded.spec.ts e2e/legal-routes.spec.ts --reporter=list

      - name: Upload Playwright report on failure
        if: failure() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
