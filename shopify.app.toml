# Shopify App Configuration — DisputeDesk (Dispute Ops)
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "84f40ec77c9ba18e9eabc1657d9b6af8"
name = "DisputeDesk"
application_url = "https://disputedesk.app"
embedded = true

[auth]
redirect_urls = [
  "https://disputedesk.app/api/auth/shopify/callback",
]

[access_scopes]
# Tightened 2026-05-11 (commit 86fc992, app version disputedesk-17).
# Audit re-run before that deploy confirmed zero references in `lib/`
# or `app/` to: read_files, read_inventory, read_locations,
# write_draft_orders, write_files, write_fulfillments, write_inventory,
# write_merchant_managed_fulfillment_orders, write_orders,
# write_products. No GraphQL mutations call any of those scopes
# either (verified: no draftOrderCreate, fulfillmentCreate,
# productCreate, orderCreate, fileCreate, inventoryAdjust callers).
#
# 2026-05-14 — LSE-4 adds two scopes:
#   * `read_customer_events` — required to read Web Pixel events
#   * `write_pixels` — required to call webPixelCreate during OAuth so
#     dispute-desk-pixel auto-registers on install (without it the
#     pixel exists in the released version but never appears under
#     Admin → Customer events on the merchant shop).
#
# History:
#   * Scopes originally approved per ticket 64535407 (2026-03-04).
#   * 2026-05-07 commit narrowed the local TOML but the change never
#     reached Partners (no deploy was run). The wider set was
#     silently in production until 2026-05-10.
#   * 2026-05-10 — `read_all_orders` approved as Protected Customer
#     Data and pushed. The tightening was deferred so the
#     read_all_orders deploy didn't bundle silent deletes.
#   * 2026-05-11 — narrowing deployed as disputedesk-17. Partners-side
#     now on the 11-scope set. Vercel env var was NOT updated then —
#     known follow-up that the LSE-4 deploy on 2026-05-14 closes.
#   * 2026-05-14 — adds read_customer_events + write_pixels for LSE-4.
#     SHOPIFY_SCOPES env on Vercel must be updated in the same deploy
#     to the 13-scope set so OAuth consent matches Partners.
#
# Seed scripts under scripts/shopify/ run via SHOPIFY_SEED_CLIENT_ID
# (a separate Partners app) and carry the broader write set there
# — never on the production app.
scopes = "read_all_orders,read_customer_events,read_customers,read_fulfillments,read_orders,read_products,read_shipping,read_shopify_payments_dispute_evidences,read_shopify_payments_dispute_file_uploads,read_shopify_payments_disputes,write_pixels,write_shopify_payments_dispute_evidences,write_shopify_payments_dispute_file_uploads"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "/api/webhooks/shop-update"

  # GDPR mandatory webhooks (App Store requirement). Configured under
  # `privacy_compliance` — these are NOT regular topic subscriptions in
  # the modern Shopify CLI config schema; they have a dedicated section
  # with fixed URL fields. Handlers live in
  # app/api/webhooks/{customers-data-request,customers-redact,shop-redact}/.
  # Note 2026-05-10: a `shopify app config pull` revealed Partners had
  # NEVER registered these despite the local TOML carrying them as
  # subscription entries since 2026-05-07 (wrong format — silently
  # rejected on prior deploy attempts). This deploy fixes the schema +
  # closes the compliance gap.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://disputedesk.app/api/webhooks/customers-data-request"
  customer_deletion_url     = "https://disputedesk.app/api/webhooks/customers-redact"
  shop_deletion_url         = "https://disputedesk.app/api/webhooks/shop-redact"

# disputes/create and disputes/update registered at runtime (OAuth) - require protected-customer-data approval in Partners

# App proxy: intentionally absent. The Partners-side app_proxy block (pulled
# 2026-05-10) was a legacy placeholder pointing at `https://example.com/proxy`
# — a literal example URL that was never used by any DisputeDesk feature.
# This deploy removes it. If a future feature needs storefront proxying,
# restore the block and configure the real URL at that time.

[pos]
embedded = false
